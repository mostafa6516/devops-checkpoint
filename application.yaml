apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-checkpoint-aldeep
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mostafa6516/devops-checkpoint.git
    targetRevision: aldeep
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: aldeep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
