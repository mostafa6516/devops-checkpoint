name: CI Pipeline

# Runs every time you push code, or open a pull request, to main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ---------- STAGE 1: BUILD (just checks the code, no dependencies needed) ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check files exist and have no syntax errors
        run: |
          python -m py_compile file.py file2.py

  # ---------- STAGE 2: RUN THE FILES (this is our "test") ----------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run file.py
        # file.py shows an interactive menu and waits for keyboard input.
        # There's no keyboard here, so we pipe in "4" (Exit) to close it cleanly.
        run: echo "4" | python file.py

      - name: Run file2.py
        run: python file2.py

  # ---------- STAGE 3: EMAIL ME IF ANYTHING ABOVE FAILED ----------
  notify:
    runs-on: ubuntu-latest
    needs: [build, test]
    if: failure()
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "CI Pipeline FAILED: ${{ github.repository }}"
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            The pipeline failed.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            See details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
