name: Build and Deploy (aldeep)

# Any push to aldeep builds a fresh image from the Dockerfile, pushes it to
# GHCR, and writes the new tag into k8s/deployment.yaml. Argo CD (automated
# sync + selfHeal on devops-checkpoint-aldeep) then picks up that commit and
# fully recreates the pod (strategy: Recreate) with the new image.

on:
  push:
    branches: [aldeep]

permissions:
  contents: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Update deployment image tag
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet || git commit -m "chore: deploy image ${{ github.sha }} [skip ci]"
          git push origin HEAD:aldeep
